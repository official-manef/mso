name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge rahmanef63/mso into fork main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream/main
        run: |
          set -euo pipefail
          git config user.name "mso-sync-bot"
          git config user.email "mso-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/rahmanef63/mso.git
          git fetch upstream main
          # Conflict must fail the job (no || true): demo differences stay visible in UI.
          git merge --no-edit upstream/main

      - name: Push main
        run: git push origin main
