name: Deploy hook

on:
  workflow_run:
    workflows: [Sync upstream]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hook
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Vercel deploy hook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST VERCEL_DEPLOY_HOOK_URL
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is empty or missing"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "${DEPLOY_HOOK_URL}"
